# Configuración de Netlify para la web de Hammer Padel (Next.js).
# Guía paso a paso: docs/despliegue-netlify.md
#
# Netlify detecta Next.js e instala solo su adaptador (OpenNext / "Next.js
# Runtime"): las páginas dinámicas, /api/* y las server actions se convierten
# en funciones de Netlify. No hace falta añadir ningún plugin aquí.
#
# Las credenciales (DATABASE_URL, ADMIN_PASSWORD, Telegram, SMTP...) NUNCA van
# en este archivo ni en GitHub: se ponen en Netlify > Project configuration >
# Environment variables.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Cabeceras de seguridad básicas para todas las páginas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Solo HTTPS durante un año (Netlify ya sirve todo por HTTPS).
    Strict-Transport-Security = "max-age=31536000"
    # Política básica: nadie puede incrustar la web, ni cambiar su base, ni
    # enviar sus formularios a otra dirección. No limita scripts ni vídeos.
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'"

# Vídeos e imágenes de la web: el navegador los guarda un día y, después, los
# sigue usando mientras comprueba si han cambiado (una semana). Sin nombres con
# huella, no conviene más: un vídeo re-renderizado con el mismo nombre tardaría
# en verse.
[[headers]]
  for = "/medios/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# El panel de reservas no debe guardarse en cachés intermedias.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
