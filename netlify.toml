# Configuración de Netlify para la web de Hammer Padel (Next.js).
# Guía paso a paso: docs/despliegue-netlify.md
#
# Netlify detecta Next.js e instala solo su adaptador (OpenNext / "Next.js
# Runtime"): las páginas dinámicas, /api/* y las server actions se convierten
# en funciones de Netlify. No hace falta añadir ningún plugin aquí.
#
# Las credenciales (DATABASE_URL, ADMIN_PASSWORD, Telegram, SMTP...) NUNCA van
# en este archivo ni en GitHub: se ponen en Netlify > Project configuration >
# Environment variables.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Cabeceras de seguridad básicas para todas las páginas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# El panel de reservas no debe guardarse en cachés intermedias.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
